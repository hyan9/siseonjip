      <stop offset="0%" stop-color="#2a3045"/>
      <stop offset="55%" stop-color="#161927"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#kdnm-bg)"/>

  <!-- 별 (안전 영역 안) -->
  <g fill="rgba(255,255,255,0.85)">
