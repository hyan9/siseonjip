<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 카든냥 — 카메라 든 냥이 (둥근 모서리 사각형 배경 + 마스코트) -->
  <rect width="512" height="512" rx="96" fill="#1a1d1f"/>
  <g transform="translate(81 81) scale(2.92)" fill="#f1f2ee">
    <!-- 꼬리 -->
    <path d="M 86 100 Q 102 88 96 72" stroke="#f1f2ee" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 몸 -->
    <ellipse cx="60" cy="92" rx="32" ry="20"/>
    <!-- 발 -->
    <ellipse cx="46" cy="108" rx="5" ry="3"/>
    <ellipse cx="74" cy="108" rx="5" ry="3"/>
    <!-- 머리 -->
    <circle cx="60" cy="48" r="30"/>
    <!-- 귀 -->
    <path d="M 36 36 L 40 18 L 52 32 Z"/>
    <path d="M 84 36 L 80 18 L 68 32 Z"/>
    <path d="M 41 30 L 43 22 L 48 30 Z" fill="#1a1d1f" opacity="0.9"/>
    <path d="M 79 30 L 77 22 L 72 30 Z" fill="#1a1d1f" opacity="0.9"/>
    <!-- 카메라 -->
    <rect x="32" y="40" width="56" height="26" rx="3" fill="#1a1d1f" stroke="#f1f2ee" stroke-width="2.5"/>
    <rect x="46" y="34" width="14" height="6" rx="1" fill="#1a1d1f" stroke="#f1f2ee" stroke-width="2"/>
    <circle cx="76" cy="38" r="2.5"/>
    <!-- 렌즈 -->
    <circle cx="60" cy="53" r="11" stroke="#1a1d1f" stroke-width="2"/>
    <circle cx="60" cy="53" r="7" fill="#1a1d1f"/>
    <circle cx="60" cy="53" r="3"/>
    <!-- 입 -->
    <path d="M 56 72 Q 60 75 64 72" stroke="#1a1d1f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 수염 -->
    <line x1="20" y1="56" x2="32" y2="58" stroke="#f1f2ee" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="62" x2="32" y2="62" stroke="#f1f2ee" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="58" x2="88" y2="58" stroke="#f1f2ee" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="62" x2="88" y2="62" stroke="#f1f2ee" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
