<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 카든냥 maskable — 도화지 페르소나, Android 안전 영역(중앙 80%) 안에 고양이 배치 -->
  <rect width="512" height="512" fill="#f1f2ee"/>
  <g transform="translate(106 96) scale(2.5)">
    <!-- 꼬리 -->
    <path d="M 86 100 Q 102 88 96 72" stroke="#1a1d1f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 몸 -->
    <ellipse cx="60" cy="92" rx="32" ry="20" fill="#1a1d1f"/>
    <!-- 발 -->
    <ellipse cx="46" cy="108" rx="5" ry="3" fill="#1a1d1f"/>
    <ellipse cx="74" cy="108" rx="5" ry="3" fill="#1a1d1f"/>
    <!-- 머리 -->
    <circle cx="60" cy="48" r="30" fill="#1a1d1f"/>
    <!-- 귀 -->
    <path d="M 36 36 L 40 18 L 52 32 Z" fill="#1a1d1f"/>
    <path d="M 84 36 L 80 18 L 68 32 Z" fill="#1a1d1f"/>
    <!-- 귀 안쪽 -->
    <path d="M 41 30 L 43 22 L 48 30 Z" fill="#f1f2ee" opacity="0.9"/>
    <path d="M 79 30 L 77 22 L 72 30 Z" fill="#f1f2ee" opacity="0.9"/>
    <!-- 카메라 본체 -->
    <rect x="32" y="40" width="56" height="26" rx="3" fill="#f1f2ee" stroke="#1a1d1f" stroke-width="2.5"/>
    <rect x="46" y="34" width="14" height="6" rx="1" fill="#f1f2ee" stroke="#1a1d1f" stroke-width="2"/>
    <circle cx="76" cy="38" r="2.5" fill="#d97757"/>
    <!-- 렌즈 -->
    <circle cx="60" cy="53" r="11" fill="#1a1d1f" stroke="#f1f2ee" stroke-width="2"/>
    <circle cx="60" cy="53" r="6" fill="#d97757"/>
    <circle cx="60" cy="53" r="2.5" fill="#f1f2ee"/>
    <!-- 입 -->
    <path d="M 56 72 Q 60 75 64 72" stroke="#f1f2ee" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 수염 -->
    <line x1="20" y1="56" x2="32" y2="58" stroke="#1a1d1f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="62" x2="32" y2="62" stroke="#1a1d1f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="58" x2="88" y2="58" stroke="#1a1d1f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="62" x2="88" y2="62" stroke="#1a1d1f" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
